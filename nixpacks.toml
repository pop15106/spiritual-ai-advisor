# Railway Nixpacks configuration
# Adds system dependencies required by Python packages (swisseph/Kerykeion needs sqlite3)

[phases.setup]
nixPkgs = ["sqlite"]
aptPkgs = ["libsqlite3-dev", "libsqlite3-0"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[variables]
LD_LIBRARY_PATH = "/usr/lib/x86_64-linux-gnu:/nix/var/nix/profiles/default/lib"
